services:
  # Postgres + pgvector（向量数据库）
  db:
    image: pgvector/pgvector:pg16
    container_name: kb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kb}"]
      interval: 5s
      retries: 20

  # 问答服务（所有配置来自 .env）
  app:
    build: .
    container_name: kb-app
    restart: unless-stopped
    env_file:
      - path: .env          # 不存在也不报错（会用默认值启动）
        required: false
    environment:
      # 容器网络内数据库主机名是 db；.env 里若显式配置了 DATABASE_URL 则以 .env 为准
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/kb}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app        # 改代码后容器重启即生效
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
